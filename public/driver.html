<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>حاويات برو — السائق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Changa:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0F1923;--amber:#F7A823;--amber-d:#D88A06;
  --green:#1B9E6E;--green-soft:#E5F7F1;
  --red:#D64545;--red-soft:#FBEAEA;
  --blue:#2E7DD1;--blue-soft:#E8F2FB;
  --steel:#4A6375;--muted:#8DA1AF;--line:#DDE5EB;--bg:#EDF1F4;
}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:20px}

/* الهيدر */
.hdr{background:var(--ink);padding:10px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:50}
.hdr-brand{display:flex;align-items:center;gap:8px;flex:1}
.hdr-ico{width:32px;height:26px;border-radius:6px;background:var(--amber);background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.12) 6px 9px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);position:relative;flex-shrink:0}
.hdr-ico::before{content:"";position:absolute;top:-3px;right:4px;left:4px;height:3px;background:var(--amber-d);border-radius:2px}
.hdr h1{font-family:'Changa';font-size:.9rem;font-weight:700;color:#fff;line-height:1}
.hdr h1 small{display:block;font-size:.58rem;color:#7A95A8;font-weight:400}
.hdr-badge{background:rgba(247,168,35,.15);border:1px solid rgba(247,168,35,.2);border-radius:14px;padding:3px 9px;font-size:.64rem;font-weight:700;color:var(--amber)}
.hdr-logout{background:rgba(214,69,69,.12);border:1px solid rgba(214,69,69,.2);color:#D68888;border-radius:8px;padding:5px 10px;font:inherit;font-size:.68rem;cursor:pointer}

/* شريط الحالة */
.status-bar{background:#fff;border-bottom:1px solid var(--line);padding:7px 14px;display:flex;align-items:center;gap:7px;font-size:.72rem;color:var(--steel)}
.s-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* المحتوى */
.content{padding:10px 12px}

/* ===== بطاقة الطلب المضغوطة ===== */
.order-card{
  background:#fff;border-radius:14px;
  box-shadow:0 2px 8px rgba(15,25,35,.08);
  margin-bottom:10px;overflow:hidden;
  border:2px solid transparent;transition:border-color .2s;
}
.order-card.st-new{border-color:rgba(247,168,35,.4)}
.order-card.st-enroute{border-color:var(--blue)}
.order-card.st-done{border-color:var(--green);opacity:.7}

/* رأس البطاقة - مضغوط */
.card-head{
  padding:10px 12px;
  display:flex;align-items:center;gap:8px;
  cursor:pointer;user-select:none;
}
.card-head-left{flex:1;min-width:0}
.card-num{font-family:'Changa';font-size:1rem;font-weight:700;color:var(--ink)}
.card-cust{font-size:.74rem;color:var(--steel);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-badges{display:flex;align-items:center;gap:5px;flex-shrink:0}
.badge{font-size:.6rem;font-weight:700;padding:3px 8px;border-radius:14px;display:inline-block;white-space:nowrap}
.bd-blue{background:var(--blue-soft);color:var(--blue)}
.bd-amber{background:#FFF8EA;color:var(--amber-d)}
.bd-green{background:var(--green-soft);color:var(--green)}
.bd-gray{background:var(--bg);color:var(--steel)}
.expand-ico{font-size:.8rem;color:var(--muted);transition:transform .2s;flex-shrink:0}
.order-card.expanded .expand-ico{transform:rotate(180deg)}

/* شريط التقدم المضغوط */
.progress-mini{
  padding:0 12px 8px;
  display:flex;align-items:center;gap:0;
}
.pm-step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.pm-step::before{content:"";position:absolute;top:9px;right:50%;width:100%;height:2px;background:var(--line);z-index:0}
.pm-step:first-child::before{display:none}
.pm-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;position:relative;z-index:1;font-size:.5rem;font-weight:700;color:var(--muted)}
.pm-dot.done{background:var(--green);border-color:var(--green);color:#fff}
.pm-dot.active{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.pm-step.done::before{background:var(--green)}
.pm-lbl{font-size:.55rem;color:var(--muted);margin-top:3px;font-weight:600}
.pm-step.done .pm-lbl{color:var(--green)}
.pm-step.active .pm-lbl{color:var(--amber-d)}

/* تفاصيل الطلب - تظهر عند التوسيع */
.card-body{display:none;padding:0 12px 10px;border-top:1px solid var(--line)}
.order-card.expanded .card-body{display:block}

.info-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #F5F7F9}
.info-row:last-child{border-bottom:none}
.info-ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:.8rem;flex-shrink:0}
.info-ico.blue{background:var(--blue-soft)}
.info-ico.green{background:var(--green-soft)}
.info-ico.amber{background:#FFF8EA}
.info-ico.red{background:var(--red-soft)}
.info-t{font-size:.78rem;font-weight:600;color:var(--ink)}
.info-s{font-size:.66rem;color:var(--steel);margin-top:1px}

/* خريطة مصغرة */
.mini-map{border-radius:10px;overflow:hidden;margin:8px 0;border:1px solid var(--line)}
.mini-map-el{height:140px}

/* أزرار الإجراءات */
.card-actions{display:flex;gap:6px;padding:8px 12px;background:#FAFBFC;flex-wrap:wrap}
.btn{border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:9px;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:.76rem;padding:9px 12px}
.btn:active{transform:scale(.97)}
.btn-blue{background:var(--blue);color:#fff;flex:2}
.btn-green{background:var(--green);color:#fff;flex:2}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink);flex:1}
.btn-call{background:var(--green-soft);border:1px solid rgba(27,158,110,.2);color:var(--green);flex:1}

/* نافذة الإنجاز */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,35,.6);z-index:100;display:none;align-items:flex-end;padding:14px;backdrop-filter:blur(4px)}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:18px;padding:18px;width:100%;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-family:'Changa';font-size:1rem;margin-bottom:12px;color:var(--ink)}
.modal textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px;font:inherit;font-size:.8rem;resize:none;height:70px}
.modal textarea:focus{outline:none;border-color:var(--amber)}
.modal-actions{display:flex;gap:8px;margin-top:10px}
.modal-actions .btn{flex:1;justify-content:center;padding:11px}
.photo-preview{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.photo-thumb{width:70px;height:70px;border-radius:8px;object-fit:cover;border:2px solid var(--line)}

/* توست */
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:24px;font-size:.76rem;z-index:200;opacity:0;pointer-events:none;transition:all .2s;display:flex;align-items:center;gap:6px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast .dot{width:5px;height:5px;border-radius:50%;background:var(--amber);flex-shrink:0}

/* حالة فارغة */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ico{font-size:2.5rem;margin-bottom:10px;display:block;opacity:.35}
.empty .t{font-size:.86rem;font-weight:600;color:var(--steel)}
.empty .s{font-size:.74rem;margin-top:5px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-brand">
    <div class="hdr-ico"></div>
    <h1>حاويات برو<small id="driverName">السائق</small></h1>
  </div>
  <span class="hdr-badge">سائق</span>
  <button class="hdr-logout" onclick="logout()">خروج</button>
</div>

<div class="status-bar">
  <span class="s-dot" id="sDot"></span>
  <span id="statusText">جارٍ تحميل طلباتك…</span>
</div>

<div class="content" id="content">
  <div class="empty"><span class="ico">⏳</span><div class="t">جارٍ التحميل…</div></div>
</div>

<!-- نافذة تأكيد الإنجاز -->
<div class="modal-bg" id="doneModal">
  <div class="modal">
    <h3>✅ تأكيد إنجاز الطلب</h3>
    <textarea id="doneNote" placeholder="ملاحظات اختيارية…"></textarea>
    <div style="margin-top:8px">
      <button class="btn btn-ghost" onclick="takePhoto()" style="width:100%;margin-bottom:6px;justify-content:center">📸 تصوير الموقع</button>
      <div class="photo-preview" id="photoPreview"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-green" onclick="confirmDone()">✓ تأكيد الإنجاز</button>
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastTxt"></span></div>

<script>
const T = localStorage.getItem('token');
if (!T) location.href = '/';
const who = JSON.parse(localStorage.getItem('who') || '{}');
if (who.role !== 'DRIVER') location.href = '/app.html';
document.getElementById('driverName').textContent = who.name || 'السائق';

const api = (u, o={}) => fetch('/api/co' + u, {
  ...o, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + T }
}).then(async r => { const d = await r.json(); if (!r.ok) { showToast('⚠ ' + (d.error||'خطأ')); throw d; } return d; });

const typeAr = { DROP:'إنزال', PICKUP:'رفع', SWAP:'تبديل', MOVE:'نقل', PROJECT_CYCLE:'دورة' };
const typeBd = { DROP:'bd-blue', PICKUP:'bd-green', SWAP:'bd-amber', MOVE:'bd-gray', PROJECT_CYCLE:'bd-blue' };
const stLbl = { NEW:'جديد', ASSIGNED:'مسند', EN_ROUTE:'بالطريق', DONE:'منفذ' };
const stBd = { NEW:'bd-gray', ASSIGNED:'bd-amber', EN_ROUTE:'bd-blue', DONE:'bd-green' };

let orders = [];
let activeOrderId = null;
let capturedPhotos = [];
let currentOrderId = null;
let expandedCards = new Set();
let mapInstances = {};

/* ===== Socket.IO ===== */
let socket = null;
function initSocket() {
  socket = io({ auth: { token: T } });
  socket.on('connect', () => {
    document.getElementById('sDot').style.background = 'var(--green)';
    setTimeout(autoStartTracking, 1000);
  });
  socket.on('disconnect', () => {
    document.getElementById('sDot').style.background = 'var(--red)';
  });
}

function autoStartTracking() {
  if (!navigator.geolocation) return;
  function send(pos) {
    if (!socket?.connected) return;
    const cur = orders.find(o => o.id === currentOrderId);
    socket.emit('driver:location', {
      lat: pos.coords.latitude, lng: pos.coords.longitude,
      orderId: currentOrderId,
      containerCode: cur?.container?.code || null,
      heading: pos.coords.heading, speed: pos.coords.speed,
    });
  }
  navigator.geolocation.watchPosition(send, ()=>{}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 });
  setInterval(() => navigator.geolocation.getCurrentPosition(send, ()=>{}, { enableHighAccuracy: true }), 10000);
}

/* ===== تحميل الطلبات ===== */
async function loadOrders() {
  try {
    orders = await api('/driver/orders');
    renderOrders();
    const txt = orders.length ? `لديك ${orders.length} طلب نشط` : 'لا توجد طلبات مسندة';
    document.getElementById('statusText').textContent = txt;
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="empty"><span class="ico">⚠️</span><div class="t">تعذر التحميل</div><button class="btn btn-ghost" onclick="loadOrders()" style="margin-top:12px">إعادة المحاولة</button></div>';
  }
}

function renderOrders() {
  const el = document.getElementById('content');
  if (!orders.length) {
    el.innerHTML = '<div class="empty"><span class="ico">📦</span><div class="t">لا توجد طلبات مسندة</div><div class="s">ستظهر هنا طلباتك</div><button class="btn btn-ghost" onclick="loadOrders()" style="margin-top:12px;padding:9px 18px">🔄 تحديث</button></div>';
    return;
  }
  el.innerHTML = orders.map(o => {
    const isNew = o.status === 'NEW' || o.status === 'ASSIGNED';
    const isEnroute = o.status === 'EN_ROUTE';
    const isDone = o.status === 'DONE';
    const isExp = expandedCards.has(o.id);
    const stCls = isDone ? 'st-done' : isEnroute ? 'st-enroute' : 'st-new';
    const s1 = true, s2 = isEnroute || isDone, s3 = isDone;
    return `
    <div class="order-card ${stCls} ${isExp ? 'expanded' : ''}" id="card-${o.id}">
      <!-- رأس مضغوط -->
      <div class="card-head" onclick="toggleCard(${o.id})">
        <div class="card-head-left">
          <div class="card-num">#${o.id} — ${o.customerName}</div>
          <div class="card-cust">${typeAr[o.type]||o.type}${o.size?' · '+o.size:''}${o.container?' · '+o.container.code:''}</div>
        </div>
        <div class="card-badges">
          <span class="badge ${stBd[o.status]||'bd-gray'}">${stLbl[o.status]||o.status}</span>
          ${o.dueDate ? `<span class="badge bd-amber">${new Date(o.dueDate).toLocaleDateString('ar-SA',{month:'short',day:'numeric'})}</span>` : ''}
        </div>
        <span class="expand-ico">▼</span>
      </div>

      <!-- شريط تقدم مصغر -->
      <div class="progress-mini">
        <div class="pm-step done"><div class="pm-dot done">✓</div><div class="pm-lbl">استلام</div></div>
        <div class="pm-step ${s2?'done':isNew?'active':''}"><div class="pm-dot ${s2?'done':isNew?'active':''}">🚚</div><div class="pm-lbl">طريق</div></div>
        <div class="pm-step ${s3?'done':''}"><div class="pm-dot ${s3?'done':''}">📦</div><div class="pm-lbl">إنجاز</div></div>
      </div>

      <!-- التفاصيل (تظهر عند التوسيع) -->
      <div class="card-body">
        <div class="info-row">
          <div class="info-ico blue">📞</div>
          <div>
            <div class="info-t"><a href="tel:${o.phone1}" style="color:var(--blue)">${o.phone1}</a></div>
            ${o.phoneSite?`<div class="info-s">موقع: <a href="tel:${o.phoneSite}" style="color:var(--blue)">${o.phoneSite}</a></div>`:''}
            ${o.phone3?`<div class="info-s">إضافي: <a href="tel:${o.phone3}" style="color:var(--blue)">${o.phone3}</a></div>`:''}
          </div>
        </div>
        ${o.address?`<div class="info-row"><div class="info-ico amber">📍</div><div><div class="info-t">${o.address}</div>${o.lat&&o.lng?`<div class="info-s"><a href="https://maps.google.com/?q=${o.lat},${o.lng}" target="_blank" style="color:var(--blue)">فتح في خرائط قوقل ↗</a></div>`:''}</div></div>`:''}
        ${o.contractNo?`<div class="info-row"><div class="info-ico green">📄</div><div class="info-t">عقد رقم: ${o.contractNo}</div></div>`:''}
        ${o.container?`<div class="info-row"><div class="info-ico" style="background:#EFEAFE">📦</div><div><div class="info-t">${o.container.code}</div><div class="info-s">${o.container.size||''}</div></div></div>`:''}
        ${o.lat&&o.lng?`<div class="mini-map"><div id="map-${o.id}" class="mini-map-el"></div></div>`:''}
        ${o.notes?`<div class="info-row"><div class="info-ico" style="background:#F4F7F9">📝</div><div class="info-t" style="font-size:.74rem;color:var(--steel)">${o.notes}</div></div>`:''}
      </div>

      <!-- أزرار الإجراءات -->
      <div class="card-actions">
        ${isNew ? `<button class="btn btn-blue" onclick="markEnRoute(${o.id},event)">🚚 بدأت التوجه</button>` : ''}
        ${isEnroute ? `<button class="btn btn-green" onclick="openDoneModal(${o.id},event)">✅ تم التنفيذ</button>` : ''}
        <a href="tel:${o.phone1}" class="btn btn-call" onclick="event.stopPropagation()">📞 اتصال</a>
        ${o.lat&&o.lng?`<a href="https://maps.google.com/?q=${o.lat},${o.lng}" target="_blank" class="btn btn-ghost" onclick="event.stopPropagation()" style="font-size:.7rem">🗺</a>`:''}
      </div>
    </div>`;
  }).join('');

  // تهيئة الخرائط للبطاقات الموسعة
  setTimeout(() => initExpandedMaps(), 100);
}

function toggleCard(id) {
  if (expandedCards.has(id)) expandedCards.delete(id);
  else expandedCards.add(id);
  renderOrders();
  setTimeout(() => {
    const o = orders.find(x => x.id === id);
    if (o?.lat && expandedCards.has(id)) initMap(id, o.lat, o.lng, o.customerName, o.address);
  }, 50);
}

function initExpandedMaps() {
  expandedCards.forEach(id => {
    const o = orders.find(x => x.id === id);
    if (o?.lat && o?.lng) initMap(id, o.lat, o.lng, o.customerName, o.address);
  });
}

function initMap(id, lat, lng, name, addr) {
  const el = document.getElementById('map-' + id);
  if (!el || el._leaflet_id) return;
  const m = L.map(el, { zoomControl: false, dragging: true, scrollWheelZoom: false }).setView([lat, lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(m);
  L.marker([lat, lng]).addTo(m).bindPopup(`<b>${name}</b><br>${addr||''}`).openPopup();
  mapInstances[id] = m;
}

/* ===== الإجراءات ===== */
async function markEnRoute(id, e) {
  if(e) e.stopPropagation();
  navigator.geolocation.getCurrentPosition(
    async pos => {
      await api('/driver/orders/' + id + '/action', { method:'POST', body:JSON.stringify({ action:'enroute', lat:pos.coords.latitude, lng:pos.coords.longitude }) });
      currentOrderId = id;
      if(socket) socket.emit('driver:status', { orderId:id, status:'EN_ROUTE' });
      showToast('🚚 أنت في الطريق');
      loadOrders();
    },
    async () => {
      await api('/driver/orders/' + id + '/action', { method:'POST', body:JSON.stringify({ action:'enroute' }) });
      showToast('✓ تم التحديث');
      loadOrders();
    }
  );
}

function openDoneModal(id, e) {
  if(e) e.stopPropagation();
  activeOrderId = id;
  capturedPhotos = [];
  document.getElementById('doneNote').value = '';
  document.getElementById('photoPreview').innerHTML = '';
  document.getElementById('doneModal').classList.add('open');
}

function closeModal() { document.getElementById('doneModal').classList.remove('open'); activeOrderId = null; }

async function confirmDone() {
  if (!activeOrderId) return;
  const note = document.getElementById('doneNote').value;
  navigator.geolocation.getCurrentPosition(
    async pos => {
      await api('/driver/orders/' + activeOrderId + '/action', { method:'POST', body:JSON.stringify({ action:'done', lat:pos.coords.latitude, lng:pos.coords.longitude, note }) });
      if(socket) socket.emit('driver:status', { orderId:activeOrderId, status:'DONE' });
      currentOrderId = null;
      closeModal();
      showToast('🎉 تم تسجيل الإنجاز بنجاح');
      loadOrders();
    },
    async () => {
      await api('/driver/orders/' + activeOrderId + '/action', { method:'POST', body:JSON.stringify({ action:'done', note }) });
      closeModal();
      showToast('🎉 تم تسجيل الإنجاز');
      loadOrders();
    }
  );
}

function takePhoto() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      capturedPhotos.push(ev.target.result);
      const img = document.createElement('img');
      img.src = ev.target.result; img.className = 'photo-thumb';
      document.getElementById('photoPreview').appendChild(img);
      showToast('تم التقاط الصورة ✓');
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastTxt').textContent = msg;
  t.classList.add('show'); clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 3000);
}

function logout() { localStorage.clear(); location.href = '/'; }

/* التشغيل */
initSocket();
loadOrders();
setInterval(loadOrders, 20000);
</script>
</body>
</html>

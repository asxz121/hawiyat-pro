<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>حاويات برو — السائق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Changa:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0F1923;--ink2:#1A2B3C;
  --amber:#F7A823;--amber-d:#D88A06;--amber-soft:#FFF8EA;
  --green:#1B9E6E;--green-soft:#E5F7F1;
  --red:#D64545;--red-soft:#FBEAEA;
  --blue:#2E7DD1;--blue-soft:#E8F2FB;
  --steel:#4A6375;--muted:#8DA1AF;
  --line:#DDE5EB;--bg:#EDF1F4;
}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.num{font-family:'Changa',sans-serif}

/* ===== الهيدر ===== */
.header{
  background:var(--ink);padding:14px 16px;
  display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:50;
}
.header-brand{display:flex;align-items:center;gap:9px;flex:1}
.brand-icon{width:36px;height:30px;border-radius:7px;background:var(--amber);background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.12) 6px 9px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);position:relative;flex-shrink:0}
.brand-icon::before{content:"";position:absolute;top:-4px;right:5px;left:5px;height:3px;background:var(--amber-d);border-radius:2px}
.header h1{font-family:'Changa';font-size:1rem;font-weight:700;color:#fff;line-height:1}
.header h1 small{display:block;font-size:.6rem;color:#7A95A8;font-weight:400}
.driver-badge{background:rgba(247,168,35,.15);border:1px solid rgba(247,168,35,.25);border-radius:20px;padding:4px 10px;font-size:.68rem;font-weight:700;color:var(--amber)}

/* ===== المحتوى ===== */
.content{padding:14px}

/* ===== بطاقة الطلب ===== */
.order-card{
  background:#fff;border-radius:16px;
  box-shadow:0 2px 8px rgba(15,25,35,.08),0 1px 2px rgba(15,25,35,.06);
  margin-bottom:14px;overflow:hidden;
  border:2px solid transparent;
  transition:border-color .2s;
}
.order-card.active{border-color:var(--amber)}
.order-card.enroute{border-color:var(--blue)}

.order-head{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.order-num{font-family:'Changa';font-size:1.1rem;font-weight:700;color:var(--ink)}
.order-type{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:20px}
.type-drop{background:#E8F2FB;color:var(--blue)}
.type-pick{background:#E5F7F1;color:var(--green)}
.type-swap{background:#FFF8EA;color:var(--amber-d)}
.type-move{background:#EFEAFE;color:#7A5AF8}
.order-status{margin-inline-start:auto}

.order-body{padding:14px 16px}
.info-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.info-ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:.9rem;flex-shrink:0}
.info-ico.blue{background:var(--blue-soft)}
.info-ico.green{background:var(--green-soft)}
.info-ico.amber{background:var(--amber-soft)}
.info-ico.red{background:var(--red-soft)}
.info-body .t{font-size:.84rem;font-weight:600;color:var(--ink)}
.info-body .s{font-size:.72rem;color:var(--steel);margin-top:2px}

.order-actions{padding:12px 16px;background:var(--bg);display:flex;gap:8px;flex-wrap:wrap}

/* ===== الأزرار ===== */
.btn{border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:10px;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;font-size:.84rem}
.btn:active{transform:scale(.97)}
.btn-amber{background:var(--amber);color:var(--ink);box-shadow:0 3px 10px rgba(247,168,35,.3);flex:1}
.btn-amber:hover{background:#FFB73B}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(46,125,209,.3);flex:1}
.btn-green{background:var(--green);color:#fff;box-shadow:0 3px 10px rgba(27,158,110,.3);flex:1}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.btn-map{background:var(--ink);color:#fff;flex:1}
.btn-photo{background:#fff;border:2px solid var(--line);color:var(--ink2);flex:1}
.btn-sm{padding:8px 12px;font-size:.76rem}
.btn-full{width:100%}

/* ===== الخريطة ===== */
.map-container{border-radius:12px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line)}
#orderMap{height:200px}

/* ===== الصور ===== */
.photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.photo-thumb{width:80px;height:80px;border-radius:10px;object-fit:cover;border:2px solid var(--line)}

/* ===== حالة فارغة ===== */
.empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-state .ico{font-size:3rem;margin-bottom:12px;display:block;opacity:.4}
.empty-state .t{font-size:.9rem;font-weight:600;color:var(--steel)}
.empty-state .s{font-size:.78rem;margin-top:6px}

/* ===== شريط الحالة ===== */
.status-bar{
  background:#fff;border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;align-items:center;gap:8px;
  font-size:.76rem;color:var(--steel);
}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ===== التوست ===== */
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink2);color:#fff;padding:11px 18px;border-radius:28px;font-size:.8rem;z-index:200;opacity:0;pointer-events:none;transition:all .22s;display:flex;align-items:center;gap:7px;max-width:90vw;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex-shrink:0}

/* ===== اللودر ===== */
.loader{text-align:center;padding:30px;color:var(--muted);font-size:.84rem}

/* ===== البادج ===== */
.badge{font-size:.65rem;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block}
.bd-blue{background:var(--blue-soft);color:var(--blue)}
.bd-amber{background:var(--amber-soft);color:var(--amber-d)}
.bd-green{background:var(--green-soft);color:var(--green)}
.bd-gray{background:var(--bg);color:var(--steel)}

/* ===== نافذة التأكيد ===== */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,35,.6);z-index:100;display:none;align-items:flex-end;padding:14px;backdrop-filter:blur(4px)}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:20px;padding:20px;width:100%;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-family:'Changa';font-size:1.05rem;margin-bottom:14px;color:var(--ink)}
.modal textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:.84rem;resize:none;height:80px}
.modal textarea:focus{outline:none;border-color:var(--amber)}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.modal-actions .btn{flex:1}

/* ===== تقدم الطلب ===== */
.progress-steps{display:flex;align-items:center;gap:0;margin:12px 0}
.step{flex:1;text-align:center;position:relative}
.step::before{content:"";position:absolute;top:14px;right:50%;width:100%;height:2px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;margin:0 auto 4px;position:relative;z-index:1;font-size:.7rem;font-weight:700;color:var(--muted)}
.step.done .step-dot{background:var(--green);border-color:var(--green);color:#fff}
.step.active .step-dot{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.step.done::before{background:var(--green)}
.step-lbl{font-size:.6rem;color:var(--muted);font-weight:600}
.step.done .step-lbl{color:var(--green)}
.step.active .step-lbl{color:var(--amber-d);font-weight:700}
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div class="brand-icon"></div>
    <h1>حاويات برو<small id="driverName">السائق</small></h1>
  </div>
  <span class="driver-badge">سائق</span>
  <button class="btn btn-ghost btn-sm" onclick="logout()" style="margin-inline-start:6px;padding:6px 10px;font-size:.7rem">خروج</button>
</div>

<div class="status-bar">
  <span class="status-dot"></span>
  <span id="statusText">متصل — جارٍ تحميل طلباتك…</span>
</div>

<div class="content" id="content">
  <div class="loader">⏳ جارٍ تحميل الطلبات…</div>
</div>

<!-- نافذة تأكيد الإنجاز -->
<div class="modal-bg" id="doneModal">
  <div class="modal">
    <h3>✅ تأكيد إنجاز الطلب</h3>
    <p style="font-size:.8rem;color:var(--steel);margin-bottom:12px">أضف ملاحظة اختيارية وصوّر الموقع قبل التأكيد</p>
    <textarea id="doneNote" placeholder="ملاحظات اختيارية…"></textarea>
    <div style="margin-top:10px">
      <button class="btn btn-ghost btn-full" onclick="takePhoto()" style="margin-bottom:8px">📸 تصوير الموقع</button>
      <div class="photo-preview" id="photoPreview"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-green" onclick="confirmDone()">✓ تأكيد الإنجاز</button>
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastTxt"></span></div>

<script>
/* ===== Socket.IO ===== */
let socket = null;
let locationInterval = null;
let currentOrderId = null;

function initSocket() {
  socket = io({ auth: { token: T } });

  socket.on('connect', () => {
    console.log('متصل بالسيرفر');
    updateConnectionStatus(true);
  });

  socket.on('disconnect', () => {
    console.log('انقطع الاتصال');
    updateConnectionStatus(false);
    stopLocationTracking();
  });

  socket.on('order:updated', (data) => {
    showToast(`تحديث: ${data.name} — ${data.status || ''}`);
    loadOrders();
  });
}

function updateConnectionStatus(connected) {
  const dot = document.querySelector('.status-dot');
  const text = document.getElementById('statusText');
  if (dot) dot.style.background = connected ? 'var(--green)' : 'var(--red)';
  if (text && !connected) text.textContent = 'انقطع الاتصال — جارٍ إعادة الاتصال…';
}

function startLocationTracking(orderId) {
  currentOrderId = orderId;
  if (locationInterval) clearInterval(locationInterval);

  const sendLocation = () => {
    navigator.geolocation.getCurrentPosition(
      pos => {
        if (socket && socket.connected) {
          socket.emit('driver:location', {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            orderId,
          });
        }
      },
      () => {},
      { enableHighAccuracy: true, timeout: 8000 }
    );
  };

  sendLocation();
  locationInterval = setInterval(sendLocation, 10000); // كل 10 ثوانٍ
  showToast('✓ بدأ إرسال موقعك تلقائياً كل 10 ثوانٍ');
}

function stopLocationTracking() {
  if (locationInterval) {
    clearInterval(locationInterval);
    locationInterval = null;
  }
}

/* ===== التهيئة ===== */
const T = localStorage.getItem('token');
if (!T) location.href = '/';
const who = JSON.parse(localStorage.getItem('who') || '{}');
if (who.role !== 'DRIVER') location.href = '/app.html';
document.getElementById('driverName').textContent = who.name || 'السائق';

const api = (u, o={}) => fetch('/api/co' + u, {
  ...o,
  headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + T }
}).then(async r => {
  const d = await r.json();
  if (!r.ok) { showToast('⚠ ' + (d.error || 'خطأ')); throw d; }
  return d;
});

/* ===== الأنواع ===== */
const typeAr = { DROP: 'إنزال', PICKUP: 'رفع', SWAP: 'تبديل', MOVE: 'نقل', PROJECT_CYCLE: 'دورة مشروع' };
const typeCls = { DROP: 'type-drop', PICKUP: 'type-pick', SWAP: 'type-swap', MOVE: 'type-move', PROJECT_CYCLE: 'type-drop' };
const stLbl = { NEW: 'جديد', ASSIGNED: 'مسند', EN_ROUTE: 'بالطريق', DONE: 'منفذ' };
const stBd = { NEW: 'bd-gray', ASSIGNED: 'bd-amber', EN_ROUTE: 'bd-blue', DONE: 'bd-green' };

let orders = [];
let activeOrderId = null;
let capturedPhotos = [];
let orderMap = null;

/* ===== تحميل الطلبات ===== */
async function loadOrders() {
  try {
    orders = await api('/driver/orders');
    renderOrders();
    document.getElementById('statusText').textContent =
      orders.length ? `لديك ${orders.length} طلب نشط` : 'لا توجد طلبات مسندة حالياً';
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="empty-state"><span class="ico">⚠️</span><div class="t">تعذر تحميل الطلبات</div><button class="btn btn-amber" onclick="loadOrders()" style="margin-top:14px">إعادة المحاولة</button></div>';
  }
}

function renderOrders() {
  const el = document.getElementById('content');
  if (!orders.length) {
    el.innerHTML = `<div class="empty-state">
      <span class="ico">📦</span>
      <div class="t">لا توجد طلبات مسندة</div>
      <div class="s">ستظهر هنا طلباتك عند إسنادها لك</div>
      <button class="btn btn-ghost" onclick="loadOrders()" style="margin-top:16px;padding:10px 20px">🔄 تحديث</button>
    </div>`;
    return;
  }

  el.innerHTML = orders.map(o => {
    const isEnroute = o.status === 'EN_ROUTE';
    const isNew = o.status === 'NEW' || o.status === 'ASSIGNED';
    const step1Done = o.status === 'EN_ROUTE' || o.status === 'DONE';
    const step2Done = o.status === 'DONE';
    return `
    <div class="order-card ${isEnroute ? 'enroute' : isNew ? 'active' : ''}">
      <div class="order-head">
        <div>
          <div class="order-num">#${o.id}</div>
          <div style="font-size:.7rem;color:var(--steel);margin-top:2px">${new Date(o.createdAt).toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'})}</div>
        </div>
        <span class="order-type ${typeCls[o.type]||'type-drop'}">${typeAr[o.type]||o.type}</span>
        <span class="badge ${stBd[o.status]||'bd-gray'} order-status">${stLbl[o.status]||o.status}</span>
      </div>

      <!-- تقدم الطلب -->
      <div style="padding:10px 16px;background:#FAFBFC;border-bottom:1px solid var(--line)">
        <div class="progress-steps">
          <div class="step done">
            <div class="step-dot">✓</div>
            <div class="step-lbl">استلام</div>
          </div>
          <div class="step ${step1Done?'done':'active'}">
            <div class="step-dot">${step1Done?'✓':'🚚'}</div>
            <div class="step-lbl">بالطريق</div>
          </div>
          <div class="step ${step2Done?'done':''}">
            <div class="step-dot">${step2Done?'✓':'📦'}</div>
            <div class="step-lbl">تم التنفيذ</div>
          </div>
        </div>
      </div>

      <div class="order-body">
        <!-- العميل -->
        <div class="info-row">
          <div class="info-ico blue">👤</div>
          <div class="info-body">
            <div class="t">${o.customerName}</div>
            <div class="s">${o.contractNo ? 'عقد رقم: ' + o.contractNo : 'بدون عقد'}</div>
          </div>
        </div>

        <!-- أرقام التواصل -->
        <div class="info-row">
          <div class="info-ico green">📞</div>
          <div class="info-body">
            <div class="t"><a href="tel:${o.phone1}" style="color:var(--blue);text-decoration:none">${o.phone1}</a></div>
            ${o.phoneSite ? `<div class="s">موقع العمل: <a href="tel:${o.phoneSite}" style="color:var(--blue)">${o.phoneSite}</a></div>` : ''}
            ${o.phone3 ? `<div class="s">رقم إضافي: <a href="tel:${o.phone3}" style="color:var(--blue)">${o.phone3}</a></div>` : ''}
          </div>
        </div>

        <!-- الموقع -->
        ${o.address ? `<div class="info-row">
          <div class="info-ico amber">📍</div>
          <div class="info-body">
            <div class="t">${o.address}</div>
            ${o.lat && o.lng ? `<div class="s"><a href="https://maps.google.com/?q=${o.lat},${o.lng}" target="_blank" style="color:var(--blue)">فتح في خرائط قوقل ↗</a></div>` : ''}
          </div>
        </div>` : ''}

        <!-- الحاوية -->
        ${o.container ? `<div class="info-row">
          <div class="info-ico" style="background:#EFEAFE">📦</div>
          <div class="info-body">
            <div class="t">${o.container.code}</div>
            <div class="s">${o.container.size||'—'}</div>
          </div>
        </div>` : o.size ? `<div class="info-row">
          <div class="info-ico" style="background:#EFEAFE">📦</div>
          <div class="info-body"><div class="t">حاوية ${o.size}</div></div>
        </div>` : ''}

        <!-- الاستحقاق -->
        ${o.dueDate ? `<div class="info-row">
          <div class="info-ico red">📅</div>
          <div class="info-body">
            <div class="t">الاستحقاق: ${new Date(o.dueDate).toLocaleDateString('ar-SA')}</div>
          </div>
        </div>` : ''}

        <!-- الخريطة إذا كان للطلب موقع -->
        ${o.lat && o.lng ? `
        <div class="map-container">
          <div id="map-${o.id}" style="height:180px"></div>
        </div>` : ''}
      </div>

      <!-- أزرار الإجراءات -->
      <div class="order-actions">
        ${isNew ? `
          <button class="btn btn-blue" onclick="markEnRoute(${o.id})">🚚 بدأت التوجه</button>
        ` : ''}
        ${isEnroute ? `
          <button class="btn btn-green" onclick="openDoneModal(${o.id})">✅ تم التنفيذ</button>
        ` : ''}
        ${o.lat && o.lng ? `
          <a href="https://maps.google.com/?q=${o.lat},${o.lng}" target="_blank" class="btn btn-map btn-sm">🗺 الخريطة</a>
        ` : ''}
        <a href="tel:${o.phone1}" class="btn btn-ghost btn-sm">📞 اتصال</a>
      </div>
    </div>`;
  }).join('');

  // تهيئة الخرائط
  setTimeout(() => {
    orders.forEach(o => {
      if (o.lat && o.lng) {
        const mapEl = document.getElementById('map-' + o.id);
        if (mapEl && !mapEl._leaflet_id) {
          const m = L.map(mapEl, { zoomControl: false, dragging: false, scrollWheelZoom: false })
            .setView([o.lat, o.lng], 15);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(m);
          L.marker([o.lat, o.lng]).addTo(m)
            .bindPopup(`<b>${o.customerName}</b><br>${o.address || ''}`)
            .openPopup();
        }
      }
    });
  }, 100);
}

/* ===== إجراءات الطلب ===== */
async function markEnRoute(id) {
  if (!confirm('تأكيد: أنت في الطريق لتنفيذ الطلب #' + id + '؟')) return;
  try {
    navigator.geolocation.getCurrentPosition(
      async pos => {
        await api('/driver/orders/' + id + '/action', {
          method: 'POST',
          body: JSON.stringify({ action: 'enroute', lat: pos.coords.latitude, lng: pos.coords.longitude })
        });
        // إشعار مدير الحركة
        if (socket) socket.emit('driver:status', { orderId: id, status: 'EN_ROUTE' });
        // بدء إرسال الموقع تلقائياً
        startLocationTracking(id);
        showToast('🚚 أنت في الطريق — جارٍ إرسال موقعك تلقائياً');
        loadOrders();
      },
      async () => {
        await api('/driver/orders/' + id + '/action', { method: 'POST', body: JSON.stringify({ action: 'enroute' }) });
        showToast('✓ تم تحديث الحالة — أنت في الطريق');
        loadOrders();
      }
    );
  } catch (e) { console.error(e); }
}

function openDoneModal(id) {
  activeOrderId = id;
  capturedPhotos = [];
  document.getElementById('doneNote').value = '';
  document.getElementById('photoPreview').innerHTML = '';
  document.getElementById('doneModal').classList.add('open');
}

function closeModal() {
  document.getElementById('doneModal').classList.remove('open');
  activeOrderId = null;
}

async function confirmDone() {
  if (!activeOrderId) return;
  const note = document.getElementById('doneNote').value;
  try {
    navigator.geolocation.getCurrentPosition(
      async pos => {
        await api('/driver/orders/' + activeOrderId + '/action', {
          method: 'POST',
          body: JSON.stringify({ action: 'done', lat: pos.coords.latitude, lng: pos.coords.longitude, note })
        });
        closeModal();
        showToast('🎉 تم تسجيل إنجاز الطلب بنجاح');
        stopLocationTracking();
        if (socket) socket.emit('driver:status', { orderId: activeOrderId, status: 'DONE' });
        loadOrders();
      },
      async () => {
        await api('/driver/orders/' + activeOrderId + '/action', {
          method: 'POST',
          body: JSON.stringify({ action: 'done', note })
        });
        closeModal();
        showToast('🎉 تم تسجيل إنجاز الطلب بنجاح');
        stopLocationTracking();
        if (socket) socket.emit('driver:status', { orderId: activeOrderId, status: 'DONE' });
        loadOrders();
      }
    );
  } catch (e) { console.error(e); }
}

/* ===== الكاميرا ===== */
function takePhoto() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      capturedPhotos.push(ev.target.result);
      const preview = document.getElementById('photoPreview');
      const img = document.createElement('img');
      img.src = ev.target.result;
      img.className = 'photo-thumb';
      preview.appendChild(img);
      showToast('تم التقاط الصورة ✓');
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

/* ===== إرسال الموقع ===== */
function sendMyLocation(orderId) {
  showToast('⏳ جارٍ تحديد موقعك…');
  navigator.geolocation.getCurrentPosition(
    async pos => {
      await api('/driver/location', {
        method: 'POST',
        body: JSON.stringify({ lat: pos.coords.latitude, lng: pos.coords.longitude, orderId })
      });
      showToast(`✓ تم إرسال موقعك (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)})`);
    },
    () => showToast('⚠ تعذر تحديد الموقع — تأكد من إذن الموقع'),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

/* ===== التوست ===== */
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastTxt').textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 3000);
}

function logout() { localStorage.clear(); location.href = '/'; }

/* ===== التشغيل ===== */
loadOrders();
initSocket();
setInterval(loadOrders, 15000);

// بدء إرسال الموقع تلقائياً فور فتح الصفحة
function autoStartTracking() {
  if (!navigator.geolocation) return;
  // إرسال أول موقع فوراً
  navigator.geolocation.getCurrentPosition(
    pos => {
      if (socket && socket.connected) {
        socket.emit('driver:location', {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          orderId: null,
        });
      }
    },
    () => {},
    { enableHighAccuracy: true, timeout: 8000 }
  );
  // ثم كل 8 ثوانٍ
  setInterval(() => {
    navigator.geolocation.getCurrentPosition(
      pos => {
        if (socket && socket.connected) {
          socket.emit('driver:location', {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            orderId: currentOrderId,
          });
        }
      },
      () => {},
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }, 8000);
}

// انتظر حتى يتصل Socket ثم ابدأ التتبع
setTimeout(autoStartTracking, 2000); // تحديث كل 30 ثانية
</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول - حاويات برو</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,sans-serif;direction:rtl;background:#0d1b2e;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:#1a2d45;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:380px;}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:2rem;}
.logo-icon{background:#F5A623;width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.logo span{color:white;font-size:20px;font-weight:600;}
h2{color:white;font-size:18px;font-weight:500;text-align:center;margin-bottom:0.4rem;}
.sub{color:rgba(255,255,255,0.5);font-size:13px;text-align:center;margin-bottom:2rem;}
label{color:rgba(255,255,255,0.7);font-size:13px;display:block;margin-bottom:6px;}
input{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:11px 14px;color:white;font-size:15px;margin-bottom:1rem;font-family:inherit;outline:none;}
input:focus{border-color:#F5A623;}
.btn{width:100%;background:#F5A623;color:#0d1b2e;border:none;padding:13px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:0.5rem;}
.btn:hover{background:#e09920;}
.error{background:rgba(220,50,50,0.15);border:1px solid rgba(220,50,50,0.3);color:#ff8080;padding:10px;border-radius:8px;font-size:13px;text-align:center;margin-bottom:1rem;display:none;}
.back{text-align:center;margin-top:1.5rem;}
.back a{color:rgba(255,255,255,0.4);font-size:13px;text-decoration:none;}
.back a:hover{color:#F5A623;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🚛</div>
    <span>حاويات برو</span>
  </div>
  <h2>تسجيل الدخول</h2>
  <p class="sub">أدخل بياناتك للوصول للنظام</p>
  <div class="error" id="err"></div>
  <label>رقم الجوال</label>
  <input type="tel" id="phone" placeholder="05XXXXXXXX" inputmode="tel">
  <label>كلمة المرور</label>
  <input type="password" id="pass" placeholder="••••••••">
  <button class="btn" onclick="doLogin()">دخول</button>
  <div class="back"><a href="/landing.html">← العودة للصفحة الرئيسية</a></div>
</div>
<script>
async function doLogin(){
  const phone=document.getElementById('phone').value.trim();
  const password=document.getElementById('pass').value;
  const err=document.getElementById('err');
  err.style.display='none';
  if(!phone||!password){err.textContent='أدخل الجوال وكلمة المرور';err.style.display='block';return;}
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password})});
    const d=await r.json();
    if(!r.ok){err.textContent=d.error||'خطأ في تسجيل الدخول';err.style.display='block';return;}
    localStorage.setItem('token',d.token);
    window.location.href='/app.html';
  }catch(e){err.textContent='تعذر الاتصال بالسيرفر';err.style.display='block';}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
</html>

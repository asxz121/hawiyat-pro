<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع السائقين - حاويات برو</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .leaflet-popup-content { font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // إعدادات الاتصال والخريطة
        const T = localStorage.getItem('token');
        if (!T) { window.location.href = '/'; }

        const map = L.map('map').setView([24.7136, 46.6753], 10); // الرياض كمركز افتراضي
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // تخزين العلامات
        const driverMarkers = {};
        const orderMarkers = {};

        const socket = io({ auth: { token: T } });

        // طلب اللقطة الحالية عند الاتصال
        socket.on('connect', () => {
            socket.emit('tracking:request');
        });

        // ------- هذا هو الكود الذي حاولت لصقه في التيرمينال -------
        // استقبال حدث أن السائق متجه للعميل (تم تعديله ليناسب Leaflet)
        socket.on('driver:heading_to_order', (data) => {
            // محاولة العثور على موقع العميل (نحتاج لجلب بيانات الطلب)
            // هنا سنقوم بالبحث عن الطلب عبر API
            fetch(`/api/co/orders/${data.orderId}`, {
                headers: { 'Authorization': 'Bearer ' + T }
            })
            .then(res => res.json())
            .then(order => {
                if (order && order.lat && order.lng) {
                    // رسم خط بين السائق والعميل
                    const path = L.polyline([
                        [data.lat, data.lng],
                        [order.lat, order.lng]
                    ], { color: 'blue', dashArray: '5, 10', weight: 3 }).addTo(map);

                    // إزالة الخط بعد 15 ثانية
                    setTimeout(() => {
                        if (map.hasLayer(path)) map.removeLayer(path);
                    }, 15000);
                }
            })
            .catch(err => console.error('خطأ في جلب موقع العميل', err));
        });
        // --------------------------------------------------------

        // استقبال تحديث موقع السائق
        socket.on('driver:moved', (data) => {
            const latLng = [data.lat, data.lng];
            
            // تحديث أو إنشاء علامة السائق
            if (driverMarkers[data.driverId]) {
                driverMarkers[data.driverId].setLatLng(latLng);
                driverMarkers[data.driverId].getPopup().setContent(
                    `<b>${data.name}</b><br>السرعة: ${data.speed || 0} كم/س`
                );
            } else {
                const marker = L.marker(latLng).addTo(map);
                marker.bindPopup(`<b>${data.name}</b><br>السائق في الطريق`);
                driverMarkers[data.driverId] = marker;
                
                // إظهار العلامة إذا كانت جديدة
                map.setView(latLng, 13);
            }
        });

        // استقبال مواقع السائقين عند الطلب
        socket.on('tracking:snapshot', (drivers) => {
            drivers.forEach(data => {
                const latLng = [data.lat, data.lng];
                if (!driverMarkers[data.driverId]) {
                    const marker = L.marker(latLng).addTo(map);
                    marker.bindPopup(`<b>${data.name}</b><br>موجود حالياً`);
                    driverMarkers[data.driverId] = marker;
                }
            });
        });
    </script>
</body>
</html>

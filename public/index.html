<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حاويات برو — تسجيل الدخول</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{min-height:100vh;display:grid;place-items:center;background:#141F28;padding:16px}
.card{background:#fff;border-radius:18px;padding:34px 28px;width:100%;max-width:380px}
.mark{width:52px;height:42px;border-radius:8px;background:#F7A823;margin:0 auto 14px;background-image:repeating-linear-gradient(90deg,transparent 0 7px,rgba(0,0,0,.13) 7px 12px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
h1{text-align:center;font-size:1.3rem;color:#141F28;margin-bottom:4px}
p.s{text-align:center;color:#5B7286;font-size:.8rem;margin-bottom:22px}
label{display:block;font-size:.78rem;font-weight:600;color:#1F3140;margin:12px 0 5px}
input{width:100%;border:1px solid #DDE5EB;border-radius:10px;padding:12px;font-size:.95rem}
input:focus{outline:2px solid #F7A823;border-color:transparent}
button{width:100%;margin-top:20px;background:#F7A823;border:0;border-radius:10px;padding:13px;font-size:1rem;font-weight:700;color:#141F28;cursor:pointer}
button:hover{background:#FFB73B}
.err{background:#FBEAEA;color:#D64545;border-radius:10px;padding:10px;font-size:.8rem;margin-top:14px;display:none;text-align:center}
</style>
</head>
<body>
<form class="card" onsubmit="go(event)">
  <div class="mark"></div>
  <h1>حاويات برو</h1>
  <p class="s">نظام إدارة الحاويات — نسخة التجارب الحية</p>
  <label>رقم الجوال</label>
  <input id="phone" inputmode="tel" placeholder="05XXXXXXXX" required>
  <label>كلمة المرور</label>
  <input id="pw" type="password" required>
  <button>دخول</button>
  <div class="err" id="err"></div>
</form>
<script>
async function go(e){
  e.preventDefault();
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({phone:phone.value.trim(),password:pw.value})});
  const d=await r.json();
  if(!r.ok){err.style.display='block';err.textContent=d.error;return}
  localStorage.setItem('token',d.token);localStorage.setItem('who',JSON.stringify(d));
  location.href=d.role==='SUPER_ADMIN'?'/admin.html':'/app.html';
}
</script>
</body>
</html>
